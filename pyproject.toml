[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devsecops-baseline-service"
version = "0.1.0"
description = "Reference FastAPI service for the DevSecOps Baseline: secure Python delivery from commit to production."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "DevSecOps Baseline" }]
keywords = ["fastapi", "devsecops", "owasp", "supply-chain", "security"]

dependencies = [
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.30.0,<0.35",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29.0,<0.31",
    "alembic>=1.13.0,<1.15",
    "pydantic>=2.7.0,<2.11",
    "pydantic-settings>=2.3.0,<2.8",
    "email-validator>=2.1.0,<2.3",
    "PyJWT[crypto]>=2.8.0,<2.11",
    "argon2-cffi>=23.1.0,<26.0",
    "structlog>=24.1.0,<25.1",
    "slowapi>=0.1.9,<0.2",
    "prometheus-fastapi-instrumentator>=7.0.0,<8.0",
    "fastapi-offline>=1.7.7,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0,<9.0",
    "pytest-asyncio>=0.24.0,<0.26",
    "pytest-cov>=5.0.0,<6.0",
    "httpx>=0.27.0,<0.28",
    "aiosqlite>=0.20.0,<0.22",
    "ruff>=0.5.0,<0.12",
    "mypy>=1.10.0,<1.16",
    "black>=24.4.0,<26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: тесты против реального PostgreSQL (нужен docker compose и INTEGRATION_DATABASE_URL)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # bandit
    "C4",  # flake8-comprehensions
    "ASYNC", # flake8-async
]
ignore = [
    "S101", # asserts в тестах
    "UP017", # timezone.utc привычнее и узнаваемее, чем datetime.UTC
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S107"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]
warn_unused_ignores = false

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
