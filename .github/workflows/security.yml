name: Security Baseline
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Python dependencies from lockfile
        run: |
          uv python install 3.12
          uv sync --frozen --no-dev
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o /tmp/requirements-audit.txt
      - name: Install security tools
        run: |
          uv tool install --python 3.12 pip-audit==2.9.0
          uv tool install --python 3.12 bandit==1.8.6
          uv tool install --python 3.12 semgrep==1.136.0
          uv tool install --python 3.12 checkov==3.2.471

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: SAST Bandit
        run: |
          mkdir -p reports
          bandit -r app -f json -o reports/bandit.json || echo 'Bandit findings detected' 
      - name: SAST Semgrep
        run: semgrep scan --config p/python --config p/security-audit --json --output reports/semgrep.json app
      - name: SCA pip-audit
        run: pip-audit -r /tmp/requirements-audit.txt --format json --output reports/pip-audit.json || true
      - name: IaC Checkov
        run: checkov -f Dockerfile --framework dockerfile -o json > reports/checkov.json || true
      - name: Secret scan Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker build
        run: docker build --pull -t baseline:${{ github.sha }} .
      - name: Container scan Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: baseline:${{ github.sha }}
          format: json
          output: reports/trivy.json
          exit-code: '0'
          severity: CRITICAL,HIGH,MEDIUM,LOW
          scanners: vuln,misconfig,secret
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.20.6
      - name: SBOM CycloneDX and SPDX
        run: |
          syft baseline:${{ github.sha }} -o cyclonedx-json=reports/sbom.cdx.json
          syft baseline:${{ github.sha }} -o spdx-json=reports/sbom.spdx.json
      - name: Security release gate
        run: python security/release_gate.py reports
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.run_id }}
          path: reports/
          retention-days: 14
          if-no-files-found: warn
  release:
    needs: scan
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build release image
        run: docker build --pull -t baseline:${{ github.ref_name }} .
      - name: Export release image
        run: docker save baseline:${{ github.ref_name }} | gzip > baseline-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-image-${{ github.ref_name }}
          path: baseline-image.tar.gz
          retention-days: 14
